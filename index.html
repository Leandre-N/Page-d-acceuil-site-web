<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Onlearning</title>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap">
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <header class="top-nav">
            <div class="logo">
                <img src="img/logo.png" alt="Onlearn logo">
            </div>
            <nav class="menu">
                <a href="#">Home</a>
                <a href="#">Careers</a>
                <a href="#">Blog</a>
                <a href="#">About Us</a>
            </nav>
            <div class="auth-buttons">
                <button class="login">Log In</button>
                <button class="signup">Sign Up</button>
            </div>
        </header>
        <main>
            <section class="hero">
                <div class="hero-left">
                    <p class="tagline"> never stop learning</p>
                    <h1>Grow up your skills by online courses with <span class="highlight">Onlearning</span></h1>
                    <div class="hero-stats">
                        <button class="explore-btn">Explore Path</button>
                        <div class="ratings">
                            <img src="img/etoile.png" alt="etoile" class="etoile">
                            <div class="avatars">
                                <img src="img/avis1.png" alt="avis1">
                                <img src="img/avis2.png" alt="avis2">
                                <img src="img/avis 3.png" alt="avis 3">
                            </div>
                        </div>
                    </div>
                    <div class="student-badge">
                        <img src="img/calendrier.png" alt="calendrier">
                        <span>250k Assisted Student</span>
                    </div>
                </div>
                <div class="hero-right">
                    <img src="img/garcon.jpg" alt="garcon">
                </div>
            </section>
            <section class="popular-courses"></section>
            <section class="courses-category"></section>
        </main>
    </body>
</html>
